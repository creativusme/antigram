# Compila Antigram su un Mac di GitHub e produce Antigram.ipa,
# da installare con Sideloadly/AltStore dal PC Windows.
name: Build Antigram

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Build per iPhone (non firmata)
        run: |
          set -o pipefail
          xcodebuild \
            -project Antigram.xcodeproj \
            -scheme Antigram \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build-device.log

      - name: Crea Antigram.ipa
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Antigram.app Payload/
          zip -qry Antigram.ipa Payload

      - name: Carica Antigram.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Antigram-ipa
          path: Antigram.ipa
          retention-days: 30

      - name: Carica i log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
